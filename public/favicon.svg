<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gs-fav-grad" x1="10" y1="5" x2="90" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Sentinel Shield -->
  <path
    d="M50 8 L84 22 C84 55 68 78 50 92 C32 78 16 55 16 22 Z"
    stroke="url(#gs-fav-grad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="#0b0f19"
  />

  <!-- Grid Interconnect Network -->
  <g stroke="url(#gs-fav-grad)" stroke-width="2.5" stroke-opacity="0.9">
    <line x1="50" y1="28" x2="68" y2="40" />
    <line x1="68" y1="40" x2="68" y2="60" />
    <line x1="68" y1="60" x2="50" y2="72" />
    <line x1="50" y1="72" x2="32" y2="60" />
    <line x1="32" y1="60" x2="32" y2="40" />
    <line x1="32" y1="40" x2="50" y2="28" />

    <line x1="50" y1="50" x2="50" y2="28" />
    <line x1="50" y1="50" x2="68" y2="40" />
    <line x1="50" y1="50" x2="68" y2="60" />
    <line x1="50" y1="50" x2="50" y2="72" />
    <line x1="50" y1="50" x2="32" y2="60" />
    <line x1="50" y1="50" x2="32" y2="40" />
  </g>

  <!-- Node Points -->
  <circle cx="50" cy="28" r="4" fill="#38bdf8" />
  <circle cx="68" cy="40" r="4" fill="#38bdf8" />
  <circle cx="68" cy="60" r="4" fill="#38bdf8" />
  <circle cx="50" cy="72" r="4" fill="#38bdf8" />
  <circle cx="32" cy="60" r="4" fill="#38bdf8" />
  <circle cx="32" cy="40" r="4" fill="#38bdf8" />

  <!-- Core AI Sentinel Node -->
  <circle cx="50" cy="50" r="7" fill="#3b82f6" />
  <circle cx="50" cy="50" r="3.5" fill="#ffffff" />
</svg>